[workspace]
resolver = "2"
members = ["crates/markdusk-app", "crates/markdusk-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Pavol Dravecky"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.12"
ts-rs = { version = "10", features = ["serde-compat"] }
thiserror = "2"
anyhow = "1"

[workspace.dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "fs", "io-util", "time"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
